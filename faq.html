<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Часто задаваемые вопросы по работе WatchYourGrade">
    <title>FAQ — WatchYourGrade</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-heading: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .nav-back {
            display: inline-block;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .nav-back:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-heading);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 24px;
        }

        .document-box {
            background-color: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 24px;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: auto;
        }

        .status {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="nav-back">← На главную</a>
        <h1>Вопросы и ответы (FAQ)</h1>
        <div id="content" class="document-box"><span class="status">Загрузка документа...</span></div>
    </div>

    <script>
        fetch('faq.txt')
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сети');
                return response.text();
            })
            .then(data => {
                document.getElementById('content').textContent = data;
            })
            .catch(() => {
                document.getElementById('content').textContent = 'Ошибка загрузки документа faq.txt. Проверьте наличие файла в репозитории.';
            });
    </script>
</body>
</html>
